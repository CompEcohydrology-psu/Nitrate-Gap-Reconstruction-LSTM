loss_function: Huber
loss_function_weights:
  huber_delta: 1.0
  nse_eps: 1e-6
  rmse_alpha: 0.5
  rmse_beta: 1e-6

targets:
- nitrate_mg_l

tRange:
- 20080101
- 20260405
t_train:
- 20080101
- 20260405
t_test:
- 20080101
- 20260405

D_N_P_path: D_N_P.xlsx
